<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#14110F; --card:#1F1A17; --maroon:#B23A48; --maroon-bright:#C9505E;
    --text:#F2EDE6; --text-soft:#C4BCB2; --text-mute:#8A8178; --border:#2E2823;
  }
  html,body{width:1200px;height:630px;}
  body{
    background:var(--bg);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    display:flex; align-items:center;
    position:relative; overflow:hidden;
  }
  /* soft maroon glow behind the portrait */
  .glow{
    position:absolute; right:-140px; top:50%; transform:translateY(-50%);
    width:620px; height:620px; border-radius:50%;
    background:radial-gradient(circle, rgba(178,58,72,0.22) 0%, rgba(178,58,72,0.06) 45%, transparent 70%);
  }
  .accent{position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--maroon);}
  .inner{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:64px;
    padding:0 76px 0 82px; width:100%;
  }
  .left{flex:1; min-width:0;}
  .eyebrow{
    font-size:21px; font-weight:700; color:var(--maroon-bright);
    text-transform:uppercase; letter-spacing:0.14em; margin-bottom:26px;
  }
  h1{
    font-size:82px; font-weight:800; line-height:1.02;
    letter-spacing:-0.033em; margin-bottom:26px; white-space:nowrap;
  }
  .role{
    font-size:30px; font-weight:500; color:var(--text-soft);
    line-height:1.42; margin-bottom:38px; max-width:600px;
  }
  .creds{display:flex; align-items:center; gap:18px; margin-bottom:0;}
  .cred{
    font-size:19px; font-weight:600; color:var(--text-soft);
    border:1px solid var(--border); background:rgba(255,255,255,0.025);
    border-radius:999px; padding:11px 22px; white-space:nowrap;
  }
  .portrait-wrap{position:relative; flex-shrink:0;}
  .portrait{
    width:340px; height:340px; border-radius:50%;
    object-fit:cover; display:block;
    border:5px solid var(--maroon);
    box-shadow:0 0 0 14px rgba(178,58,72,0.13), 0 26px 60px rgba(0,0,0,0.55);
  }
  .url{
    position:absolute; z-index:2; left:82px; bottom:44px;
    display:flex; align-items:center; gap:12px;
    font-size:22px; font-weight:700; color:var(--maroon-bright);
    letter-spacing:0.01em;
  }
  .dot{width:9px; height:9px; border-radius:50%; background:var(--maroon-bright);}
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="glow"></div>
  <div class="inner">
    <div class="left">
      <div class="eyebrow">Data &amp; Research — Chicago</div>
      <h1>Rodrigo França</h1>
      <div class="role">Causal inference and machine learning on property taxation, housing markets, and regulation.</div>
      <div class="creds">
        <span class="cred">UChicago</span>
        <span class="cred">World Bank</span>
        <span class="cred">First Author, <i>Utilities Policy</i></span>
      </div>
    </div>
    <div class="portrait-wrap">
      <img class="portrait" src="assets/rodrigo-headshot@2x.jpg" alt="">
    </div>
  </div>
  <div class="url"><span class="dot"></span>rodrigofch7.github.io</div>
</body>
</html>
