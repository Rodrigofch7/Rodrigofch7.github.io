<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Mirrors the site hero: same palette, same type scale, same portrait treatment. */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#14110F; --bg-soft:#1C1815; --maroon-bright:#D66672;
    --text:#F2EDE6; --text-soft:#C4BCB2; --border:#2E2823;
  }
  html,body{width:1200px;height:630px}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; align-items:center; padding:0 78px;
  }
  .hero-top{display:grid; grid-template-columns:1fr 300px; gap:56px; align-items:center; width:100%}
  .eyebrow{
    font-size:19px; font-weight:700; color:var(--maroon-bright);
    text-transform:uppercase; letter-spacing:0.09em; margin-bottom:22px;
  }
  h1{
    font-weight:800; font-size:64px; line-height:1.08;
    letter-spacing:-0.028em; margin-bottom:26px; color:var(--text);
  }
  .hero-sub{font-size:23px; line-height:1.5; color:var(--text-soft); max-width:640px}
  .portrait{
    width:300px; height:300px; border-radius:50%;
    object-fit:cover; display:block;
    background:var(--bg-soft);
    border:1px solid var(--border);
    box-shadow:0 0 0 8px var(--bg-soft);
  }
  .url{
    position:absolute; left:78px; bottom:44px;
    display:flex; align-items:center; gap:12px;
    font-size:21px; font-weight:700; color:var(--maroon-bright);
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--maroon-bright)}
</style>
</head>
<body>
  <div class="hero-top">
    <div>
      <div class="eyebrow">Applied economist &amp; data scientist, Chicago</div>
      <h1>I turn messy data into decisions people can act on.</h1>
      <div class="hero-sub">Econometrics and machine learning on property taxes, housing, transit, and regulation.</div>
    </div>
    <img class="portrait" src="rodrigo-headshot@2x.webp" alt="">
  </div>
  <div class="url"><span class="dot"></span>rodrigofch7.github.io</div>
</body>
</html>
