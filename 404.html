<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Rodrigo Fran&ccedil;a Chaves</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
<meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110F;
    --bg-soft:#1C1815;
    --card:#1F1A17;
    --maroon:#B23A48;
    --maroon-bright:#C9505E;
    --maroon-tint:#2A1A1C;
    --text:#F2EDE6;
    --text-soft:#C4BCB2;
    --text-mute:#8A8178;
    --border:#2E2823;
    --nav-bg:rgba(20,17,15,0.85);
    --success:#5BBF73;
    --success-tint:rgba(91,191,115,0.10);
    --media-bg:#000;
    --max-w: 760px;
  }

  /* Light palette. Defined twice on purpose: the media query is what ships,
     the attribute selector lets the light theme be forced for testing. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#FAF7F2;
      --bg-soft:#F2EDE6;
      --card:#FFFFFF;
      --maroon:#A32F3D;
      --maroon-bright:#8F2733;
      --maroon-tint:#F6E9EA;
      --text:#1A1512;
      --text-soft:#4A423B;
      --text-mute:#6E655C;
      --border:#E2DAD0;
      --nav-bg:rgba(250,247,242,0.85);
      --success:#2E7D4F;
      --success-tint:rgba(46,125,79,0.10);
      --media-bg:#E8E2D9;
    }
  }
  :root[data-theme="light"]{
    --bg:#FAF7F2;
    --bg-soft:#F2EDE6;
    --card:#FFFFFF;
    --maroon:#A32F3D;
    --maroon-bright:#8F2733;
    --maroon-tint:#F6E9EA;
    --text:#1A1512;
    --text-soft:#4A423B;
    --text-mute:#6E655C;
    --border:#E2DAD0;
    --nav-bg:rgba(250,247,242,0.85);
    --success:#2E7D4F;
    --success-tint:rgba(46,125,79,0.10);
    --media-bg:#E8E2D9;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--maroon-bright); text-decoration:none;}
  a:hover{text-decoration:underline;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--maroon-bright); outline-offset:3px;}

  .wrap{max-width:var(--max-w); margin:0 auto; padding:0 24px;}

  nav{
    position:sticky; top:0; z-index:10;
    background:var(--nav-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  nav .wrap{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 24px;}
  .nav-name{font-size:14px; font-weight:700; letter-spacing:-0.01em; color:var(--text);}
  .nav-links{display:flex; gap:24px; flex-wrap:wrap; list-style:none; margin:0; padding:0;}
  .nav-links a{font-size:14px; font-weight:500; color:var(--text-soft); text-decoration:none;}
  .nav-links a:hover{color:var(--maroon-bright);}

  header.hero{padding:88px 0 56px;}
  .hero-top{display:grid; grid-template-columns:1fr 168px; gap:36px; align-items:start;}
  .hero-portrait{
    width:168px; height:168px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:1px solid var(--border);
    box-shadow:0 0 0 4px var(--bg-soft);
  }
  .eyebrow{font-size:13px; font-weight:700; color:var(--maroon-bright); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 16px;}
  h1{font-weight:800; font-size:clamp(2.2rem, 5.5vw, 3rem); line-height:1.12; margin:0 0 20px; letter-spacing:-0.025em; color:var(--text);}
  .hero-sub{font-size:18px; color:var(--text-soft); max-width:540px; margin:0 0 32px;}
  .btn-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:48px;}
  .btn{padding:13px 40px; border-radius:6px; font-size:14px; font-weight:600; text-decoration:none; display:inline-block; text-align:center;}
  .btn-primary{background:var(--maroon); color:#fff;}
  .btn-primary:hover{background:var(--maroon-bright); text-decoration:none;}
  .btn-secondary{border:1px solid var(--border); color:var(--text);}
  .btn-secondary:hover{border-color:var(--maroon-bright); color:var(--maroon-bright); text-decoration:none; background:var(--maroon-tint);}

  .hero-contacts{
    display:flex; flex-wrap:wrap; gap:10px;
    padding:28px 0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .contact-chip{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:13.5px; font-weight:600;
    font-family:inherit;
    color:var(--text-soft);
    background:transparent;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s, background .15s;
  }
  .contact-chip svg{flex-shrink:0; opacity:0.9;}
  .contact-chip:hover{
    border-color:var(--maroon-bright);
    color:var(--maroon-bright);
    background:var(--maroon-tint);
    text-decoration:none;
  }
  .contact-chip.copied{
    border-color:var(--success);
    color:var(--success);
    background:var(--success-tint);
  }

  section{padding:56px 0; border-bottom:1px solid var(--border);}
  section:last-of-type{border-bottom:none;}
  h2{font-weight:800; font-size:1.5rem; margin:0 0 28px; letter-spacing:-0.02em; color:var(--text);}
  p{margin:0 0 16px; color:var(--text-soft);}

  .about-grid{display:grid; grid-template-columns: 1fr; gap:16px;}

  .tl-item{display:grid; grid-template-columns: 110px 1fr; gap:18px; padding:20px 0; border-top:1px solid var(--border);}
  .tl-item:first-of-type{border-top:none; padding-top:0;}
  .tl-date{font-size:13px; color:var(--text-mute); padding-top:2px; font-weight:500;}
  .tl-role{font-weight:700; font-size:15.5px; color:var(--text); margin:0 0 2px;}
  .tl-org{font-size:14px; color:var(--maroon-bright); margin:0 0 8px; font-weight:600;}
  .tl-desc{font-size:14.5px; color:var(--text-soft); margin:0;}

  .proj-card{border:1px solid var(--border); border-radius:10px; padding:26px; margin-bottom:20px; background:var(--card);}
  .proj-media{width:100%; display:block; border-radius:8px; border:1px solid var(--border); margin:0 0 16px; background:var(--media-bg);}
  .proj-title{font-size:1.2rem; font-weight:700; margin:0 0 6px; color:var(--text);}
  .proj-stack{font-size:12px; color:var(--text-mute); margin:0 0 14px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;}
  .proj-desc{font-size:14.5px; margin:0 0 16px;}
  .proj-stats{display:flex; gap:24px; flex-wrap:wrap; margin:0 0 18px; padding:16px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .stat-num-sm{font-size:1.4rem; font-weight:800; color:var(--maroon-bright); display:block; line-height:1;}
  .stat-label-sm{font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.03em; font-weight:600;}
  .proj-links{display:flex; gap:18px; font-size:13.5px; font-weight:600; flex-wrap:wrap;}

  .pub-item{padding:20px 0; border-top:1px solid var(--border);}
  .pub-item:first-of-type{border-top:none; padding-top:0;}
  .pub-title{font-weight:700; font-size:15.5px; color:var(--text); margin:0 0 4px;}
  .pub-venue{font-size:12.5px; color:var(--maroon-bright); margin:0 0 8px; font-weight:600;}
  .pub-desc{font-size:14px; margin:0 0 8px;}
  .pub-thumb{width:100%; max-width:280px; display:block; border-radius:8px; border:1px solid var(--border); margin:12px 0;}

  .skills-grid{display:grid; grid-template-columns: repeat(2, 1fr); gap:24px;}
  .skill-cat-name{font-size:11.5px; color:var(--maroon-bright); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 10px; font-weight:700;}
  .skill-list{font-size:14px; color:var(--text-soft); margin:0;}

  footer{padding:48px 0 64px;}
  .contact-links{display:flex; flex-wrap:wrap; gap:16px 28px; margin-bottom:24px;}
  .contact-links a{font-size:15px; font-weight:600;}
  .footer-meta{font-size:12px; color:var(--text-mute);}

  @media (max-width: 640px){
    header.hero{padding:56px 0 40px;}
    .hero-top{grid-template-columns:1fr; gap:24px;}
    .hero-portrait{width:120px; height:120px; order:-1;}
    section{padding:40px 0;}
    .tl-item{grid-template-columns: 1fr; gap:4px;}
    .skills-grid{grid-template-columns: 1fr;}
    .nav-links{gap:16px;}
  }
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;}}

  /* Skip link: hidden until focused */
  .skip-link{
    position:absolute; left:-9999px; top:0; z-index:100;
    background:var(--maroon); color:#fff;
    padding:10px 18px; border-radius:0 0 6px 0;
    font-size:14px; font-weight:600;
  }
  .skip-link:focus{left:0; text-decoration:none;}

  .nav-links a.is-active{color:var(--maroon-bright); font-weight:700;}

  /* Video pause control — WCAG 2.2.2 needs a way to stop looping motion */
  .media-wrap{position:relative;}
  .media-toggle{
    position:absolute; right:10px; bottom:26px;
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    border:1px solid var(--border);
    background:var(--nav-bg);
    backdrop-filter:blur(6px);
    color:var(--text); font-family:inherit; font-size:12px; font-weight:600;
    cursor:pointer; opacity:0; transition:opacity .15s, border-color .15s, color .15s;
  }
  .media-wrap:hover .media-toggle,
  .media-toggle:focus-visible{opacity:1;}
  .media-toggle:hover{border-color:var(--maroon-bright); color:var(--maroon-bright);}
  @media (hover: none){.media-toggle{opacity:1;}}

  @media print{
    nav, .btn-row, .hero-contacts, .media-wrap, .skip-link, footer .contact-links{display:none !important;}
    html, body{background:#fff !important; color:#000 !important; font-size:11pt;}
    a{color:#000 !important; text-decoration:underline;}
    .wrap{max-width:none; padding:0;}
    section{padding:12pt 0; border-bottom:none; break-inside:avoid;}
    h1{font-size:20pt;} h2{font-size:13pt;}
    .eyebrow, .skill-cat-name, .tl-org, .pub-venue{color:#000 !important;}
    .proj-card{border:1px solid #ccc; background:#fff; break-inside:avoid;}
    .proj-links a[href^="http"]::after{content:" (" attr(href) ")"; font-size:9pt; word-break:break-all;}
  }
</style>
</head>

</nav>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">Error 404</p>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p class="hero-sub">The link may be out of date, or the address mistyped. Everything on this site lives on a single page.</p>
    <div class="btn-row">
      <a href="/" class="btn btn-primary">Back to the homepage</a>
      <a href="/#projects" class="btn btn-secondary">See my work</a>
    </div>
  </div>
</header>

</body>
</html>
